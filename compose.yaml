services:
  qbt-watchdog:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: qbt-watchdog:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      - qbt
    ports:
      - "127.0.0.1:8080:8080"
    command: ["--config", "/config/config.yaml"]
    volumes:
      # Writable directory mount: the Settings editor saves config.yaml and
      # .env here with a temp-file-and-rename in the config directory.
      - ./config:/config
      - qbt-watchdog-data:/data

volumes:
  qbt-watchdog-data:

networks:
  qbt:
    name: ${QBT_NETWORK:-qbt}
