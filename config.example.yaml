# qbt-watchdog configuration reference.
# Every key is shown with its default (or a required example). See
# docs/configuration.md for types, semantics, reloading and authentication modes.
# TOML is accepted too; key names and values are identical.
#
# Reload behaviour:
#   RESTART REQUIRED — state_file and listen cannot change at runtime; a change
#     is rejected with a warning and the running value is kept.
#   APPLIED LIVE — everything else, including the qBittorrent endpoint,
#     credentials, policies, timing, integrations and logging, is applied on
#     the next reload without a restart.

# --- qBittorrent endpoint -------------------------------------------------
qbt_url: "http://qbittorrent:8080"       # Required. HTTP(S) base URL, no credentials/query/fragment.

# --- Authentication (choose one mode) -------------------------------------
# API key mode (qBittorrent >= 5.2.0): set qbt_api_key or qbt_api_key_file.
qbt_api_key: ""                          # Bearer token. Mutually exclusive with the username/password mode.
qbt_api_key_file: ""                     # File holding the API key; trailing CR/LF stripped, re-read on change.
# Username/password mode (SID cookie): set qbt_username and exactly one password source.
qbt_username: ""                         # WebUI username. Requires a password.
qbt_password: ""                         # Inline password. Mutually exclusive with qbt_password_file.
qbt_password_file: ""                    # Password file; trailing CR/LF stripped, re-read on change.
# Bypass mode: leave every credential above empty.

# --- Safety ---------------------------------------------------------------
dry_run: true                            # While true every action is downgraded to warn; tag writes are suppressed.
max_actions_per_poll: 10                 # Actions (including warnings) allowed per poll; 0 disables all actions.

tag_sync:
  enabled: false                         # Write <prefix><policy> / <prefix>due status tags back to qBittorrent.
  prefix: "qbtw-"                        # Reserved tag namespace; at least 4 chars, no commas or whitespace.
  max_writes_per_poll: 20                # Cap on tag add/remove deltas per poll (independent of the action cap).

# --- Policies (mutually exclusive; action + threshold, optional arr_mode) -
policies:
  metadata:
    action: "warn"                       # warn | delete | delete_file.
    threshold: "30m"                     # Continuous match time before the action.
  stalled_no_seeders:
    action: "warn"
    threshold: "30m"
  stalled_seeders_seen:
    action: "warn"
    threshold: "30m"
  stalled_partial:
    action: "warn"
    threshold: "30m"                     # This policy acts despite downloaded bytes; treat with caution.
  completed_no_data:
    action: "warn"
    threshold: "2m"
    arr_mode: inherit                    # inherit | none | blocklist_and_search | blocklist_only | search_only.
  stopped_arr_managed:
    action: "warn"
    threshold: "10m"
    match_tags: ["Sonarr", "Radarr"]     # Required non-empty; only operator-stopped torrents carrying a tag match.
    arr_mode: inherit

# --- Timing ---------------------------------------------------------------
poll_interval: "30s"                     # Interval between completed polls; must be positive.
max_observation_gap: "90s"               # Max gap still counted as continuous; defaults to 3 x poll_interval.
http_timeout: "10s"                      # Per-request timeout against the qBittorrent API.
delete_confirmation_timeout: "2m"        # Wait for a requested deletion to disappear before retrying.

# --- Scope ----------------------------------------------------------------
include_categories: []                   # Empty means all; non-empty is an exact, case-sensitive allowlist.
exclude_categories: []                   # Exact denylist; exclusion wins over inclusion.
exclude_tags: ["keep", "qbt-watchdog-ignore"] # Torrents carrying any of these tags are never considered.

# --- Sonarr / Radarr recovery (disabled by default) -----------------------
# Recovery ordering: while the torrent is still present in qBittorrent the
# watchdog makes ONE best-effort blocklist attempt (removeFromClient=false,
# blocklist=true, skipRedownload=true, changeCategory=false). It is never
# retried. The qBittorrent delete then proceeds regardless of that outcome, and
# a replacement search runs only after a later full poll confirms the torrent
# disappeared. This keeps the release blocklisted even when the media manager
# drops its own queue row before the watchdog can act.
integrations:
  sonarr:
    enabled: false
    url: "http://sonarr:8989"            # Required with a credential while enabled.
    api_key: ""                          # Provide exactly one of api_key / api_key_file.
    api_key_file: ""
    categories: []                       # Empty matches every category; otherwise exact, case-sensitive.
    mode: blocklist_and_search           # blocklist_and_search | blocklist_only | search_only.
    timeout: "10s"                       # Positive, at most 5m.
  radarr:
    enabled: false
    url: "http://radarr:7878"
    api_key: ""
    api_key_file: ""
    categories: []
    mode: blocklist_and_search
    timeout: "10s"

# --- State ----------------------------------------------------------------
state_file: "/data/state.json"           # Persistence path. RESTART REQUIRED to change.
history_limit: 100                       # Retained history entries, 1-10000.

# --- Web interface --------------------------------------------------------
listen: ":8080"                          # host:port for pages, JSON API, health and metrics. RESTART REQUIRED.
ui_refresh_interval: "5s"                # Live fragment refresh interval.
readiness_max_age: "2m"                  # /readyz fails once the last successful poll is older than this.

# --- TLS (outbound qBittorrent client) ------------------------------------
tls_ca_file: ""                          # PEM bundle for a private CA; re-read on change.
tls_insecure_skip_verify: false          # Development-only; disables certificate verification.

# --- Logging --------------------------------------------------------------
log_level: "info"                        # debug | info | warn | error.
log_format: "json"                       # json | text | console.
log_color: "auto"                        # auto | always | never; affects console output only.
