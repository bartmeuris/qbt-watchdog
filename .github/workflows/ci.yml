name: CI and container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go checks and image metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.image.outputs.publish }}
      go-version: ${{ steps.image.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the exact module toolchain and image destination
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          module = Path('go.mod').read_text()
          toolchain = re.search(r'^toolchain go(\d+\.\d+\.\d+)$', module, re.MULTILINE)
          if toolchain is None:
              raise SystemExit('go.mod must declare an exact stable Go toolchain')
          ref = os.environ['GITHUB_REF']
          event = os.environ['GITHUB_EVENT_NAME']
          default_ref = 'refs/heads/' + os.environ['DEFAULT_BRANCH']
          release = ref.startswith('refs/tags/')
          if release:
              number = r'(?:0|[1-9][0-9]*)'
              identifier = r'(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
              build = r'(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
              semver = rf'v{number}\.{number}\.{number}(?:-{identifier}(?:\.{identifier})*)?{build}'
              if re.fullmatch(semver, ref.removeprefix('refs/tags/')) is None:
                  raise SystemExit('Release tags must be valid v-prefixed SemVer')
          publish = (event == 'push' and (ref == default_ref or release)) or (
              event == 'workflow_dispatch' and ref == default_ref
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('go-version=' + toolchain[1], file=output)
              print('name=ghcr.io/' + os.environ['REPOSITORY'].lower(), file=output)
              print('publish=' + str(publish).lower(), file=output)
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.image.outputs.go-version }}
          cache: true
      - name: Check formatting without modifying sources
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Race test
        run: make race
      - name: Image tags and OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,priority=100,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=qbt-watchdog
            org.opencontainers.image.description=qBittorrent metadata and stalled-download watchdog with a web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  binaries:
    name: Build linux/${{ matrix.arch }} binary
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.go.outputs.go-version }}
          cache: true
      - name: Build linux/${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          mkdir -p "dist/linux/${GOARCH}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build -trimpath -o "dist/linux/${GOARCH}/qbt-watchdog" ./cmd/qbt-watchdog
      - name: Verify embedded VCS metadata
        env:
          GOARCH: ${{ matrix.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          go version -m "dist/linux/${GOARCH}/qbt-watchdog" > "$RUNNER_TEMP/buildinfo.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          settings = {}
          for line in Path(os.environ['RUNNER_TEMP'], 'buildinfo.txt').read_text().splitlines():
              fields = line.strip().split('\t')
              if len(fields) == 2 and fields[0] == 'build':
                  key, _, value = fields[1].partition('=')
                  settings[key] = value

          expected = {
              'vcs.revision': os.environ['EXPECTED_REVISION'],
              'vcs.modified': 'false',
              'GOOS': 'linux',
              'GOARCH': os.environ['GOARCH'],
          }
          for key, want in expected.items():
              got = settings.get(key)
              if got != want:
                  raise SystemExit(f'{key}: expected {want!r}, got {got!r}')
          if not settings.get('vcs.time'):
              raise SystemExit('vcs.time is missing from the binary build info')
          print('verified', settings['vcs.revision'], settings['vcs.time'])
          PY
      - name: Generate SHA-256 checksum
        env:
          GOARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          cd "dist/linux/${GOARCH}"
          sha256sum qbt-watchdog > qbt-watchdog.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qbt-watchdog-linux-${{ matrix.arch }}
          path: |
            dist/linux/${{ matrix.arch }}/qbt-watchdog
            dist/linux/${{ matrix.arch }}/qbt-watchdog.sha256
          if-no-files-found: error

  image:
    name: Multi-platform image validation
    needs: [go, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qbt-watchdog-linux-amd64
          path: dist/linux/amd64
      - name: Download linux/arm64 binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qbt-watchdog-linux-arm64
          path: dist/linux/arm64
      - name: Restore executable permissions
        shell: bash
        run: chmod +x dist/linux/amd64/qbt-watchdog dist/linux/arm64/qbt-watchdog
      - name: Build both platforms without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/qbt-watchdog.oci.tar
          tags: ${{ needs.go.outputs.tags }}
          labels: ${{ needs.go.outputs.labels }}
          cache-from: type=gha,scope=container
          cache-to: ${{ needs.go.outputs.publish == 'true' && 'type=gha,mode=max,scope=container' || '' }}
      - name: Load native image for smoke validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: qbt-watchdog:smoke
          labels: ${{ needs.go.outputs.labels }}
      - name: Verify executable and embedded build metadata
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_GO_VERSION: go${{ needs.go.outputs.go-version }}
        shell: bash
        run: |
          docker run --rm --network none --read-only qbt-watchdog:smoke version > "$RUNNER_TEMP/version.json"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            export EXPECTED_TAG="${GITHUB_REF#refs/tags/}"
          fi
          export EXPECTED_COMMIT_TIME="$(git show -s --format=%cI HEAD)"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          build = json.loads((Path(os.environ['RUNNER_TEMP']) / 'version.json').read_text())

          def as_utc(timestamp):
              return datetime.fromisoformat(timestamp.replace('Z', '+00:00')).astimezone(timezone.utc)

          if build.get('revision') != os.environ['EXPECTED_REVISION']:
              raise SystemExit(f"revision: expected {os.environ['EXPECTED_REVISION']!r}, got {build.get('revision')!r}")
          if build.get('modified') is not False:
              raise SystemExit(f"modified: expected False, got {build.get('modified')!r}")
          if build.get('go_version') != os.environ['EXPECTED_GO_VERSION']:
              raise SystemExit(f"go_version: expected {os.environ['EXPECTED_GO_VERSION']!r}, got {build.get('go_version')!r}")
          if build.get('platform') != 'linux/amd64':
              raise SystemExit(f"platform: expected 'linux/amd64', got {build.get('platform')!r}")
          if as_utc(build['commit_time']) != as_utc(os.environ['EXPECTED_COMMIT_TIME']):
              raise SystemExit(f"commit_time: expected {os.environ['EXPECTED_COMMIT_TIME']!r}, got {build.get('commit_time')!r}")
          version = build.get('version', '')
          if not version or version == '(devel)':
              raise SystemExit(f'version must be a real build version, got {version!r}')
          expected_tag = os.environ.get('EXPECTED_TAG')
          if expected_tag and not version.startswith(expected_tag):
              raise SystemExit(f'version {version!r} does not start with tag {expected_tag!r}')
          print('smoke verified', version, build['revision'])
          PY
      - name: Verify packaged binary matches the uploaded artifact
        shell: bash
        run: |
          container=$(docker create qbt-watchdog:smoke)
          docker cp "${container}:/qbt-watchdog" "$RUNNER_TEMP/qbt-watchdog"
          docker rm "${container}"
          expected=$(cut -d' ' -f1 dist/linux/amd64/qbt-watchdog.sha256)
          actual=$(sha256sum "$RUNNER_TEMP/qbt-watchdog" | cut -d' ' -f1)
          if [[ "$actual" != "$expected" ]]; then
            printf 'Packaged binary checksum mismatch:\n  artifact: %s\n  image:    %s\n' "$expected" "$actual"
            exit 1
          fi
          printf 'Packaged binary matches artifact: %s\n' "$actual"

  publish:
    name: Publish to GHCR
    needs: [go, binaries, image]
    if: >-
      needs.go.outputs.publish == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qbt-watchdog-linux-amd64
          path: dist/linux/amd64
      - name: Download linux/arm64 binary
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: qbt-watchdog-linux-arm64
          path: dist/linux/arm64
      - name: Restore executable permissions
        shell: bash
        run: chmod +x dist/linux/amd64/qbt-watchdog dist/linux/arm64/qbt-watchdog
      - name: Verify downloaded artifact checksums
        shell: bash
        run: |
          for arch in amd64 arm64; do
            (cd "dist/linux/${arch}" && sha256sum -c qbt-watchdog.sha256)
          done
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.go.outputs.tags }}
          labels: ${{ needs.go.outputs.labels }}
          cache-from: type=gha,scope=container
